<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Iglesia Bautista El Faro</title>
  <meta name="description" content="Contacta a la Iglesia Bautista El Faro, Santo Domingo Norte. Teléfono, ubicación y formulario de mensajes.">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="encabezado"></div>

  <main>
    <section class="page-hero" data-fondo="contacto">
      <h1><svg class="ico" aria-hidden="true"><use href="#i-mensaje"/></svg>Contacto</h1>
      <p>Estamos para servirte</p>
    </section>

    <section class="contacto-info">
      <div class="contacto-info-grid">
        <div class="contacto-info-item">
          <svg class="ico-grande" aria-hidden="true"><use href="#i-usuario"/></svg>
          <h3>Pastor</h3>
          <p id="cPastor"></p>
        </div>
        <div class="contacto-info-item">
          <svg class="ico-grande" aria-hidden="true"><use href="#i-telefono"/></svg>
          <h3>Teléfono / WhatsApp</h3>
          <p><a id="cTelefono" href="#" target="_blank" rel="noopener"></a></p>
        </div>
        <div class="contacto-info-item">
          <svg class="ico-grande" aria-hidden="true"><use href="#i-ubicacion"/></svg>
          <h3>Dirección</h3>
          <p><a id="cDireccion" href="#" target="_blank" rel="noopener"></a></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="contacto-grid">

        <div class="contacto-form">
          <h2>¡Queremos escucharte!</h2>
          <p class="contacto-intro">Siéntete libre de escribirnos cualquier pregunta o duda que tengas.</p>

          <form id="formContacto" novalidate>
            <label for="fNombre">Nombre (requerido)</label>
            <input type="text" id="fNombre" name="nombre" required maxlength="100" autocomplete="name">

            <label for="fCorreo">Correo electrónico (requerido)</label>
            <input type="email" id="fCorreo" name="correo" required maxlength="150" autocomplete="email">

            <label for="fAsunto">Asunto</label>
            <input type="text" id="fAsunto" name="asunto" maxlength="150">

            <label for="fMensaje">Escriba su mensaje (requerido)</label>
            <textarea id="fMensaje" name="mensaje" rows="6" required maxlength="2000"></textarea>

            <!-- Campo trampa contra robots: debe quedar vacío -->
            <input type="checkbox" name="botcheck" class="campo-oculto" tabindex="-1" autocomplete="off" aria-hidden="true">

            <button type="submit" class="btn" id="formBoton">Enviar</button>
            <p class="form-estado" id="formEstado" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="contacto-mapa">
          <div class="mapa">
            <iframe
              title="Mapa de la Iglesia Bautista El Faro"
              src="https://www.google.com/maps?q=Calle+Calixto+Garcia+17,+Urbanizacion+Maximo+Gomez,+Santo+Domingo+Norte&output=embed"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen>
            </iframe>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
