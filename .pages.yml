media:
  input: img
  output: img

content:
  - name: portada
    label: Portada (foto y versículos)
    type: file
    path: data/portada.json
    format: json
    fields:
      - name: imagen
        label: Imagen de fondo
        type: image
      - name: versiculos
        label: Versículos que aparecen en la portada
        type: object
        list: true
        fields:
          - name: texto
            label: Texto del versículo
            type: text
          - name: cita
            label: Cita (ej. Juan 3:16)
            type: string

  - name: encabezados
    label: Fondos de encabezados (Actividades y Videos)
    type: file
    path: data/encabezados.json
    format: json
    fields:
      - name: actividades
        label: Fondo de la página Actividades
        type: image
      - name: videos
        label: Fondo de la página Videos
        type: image

  - name: noticias
    label: Noticias y avisos
    type: file
    path: data/noticias.json
    format: json
    fields:
      - name: items
        label: Lista de noticias
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: fecha
            label: Fecha
            type: date
          - name: texto
            label: Texto
            type: text
          - name: imagen
            label: Imagen (opcional)
            type: image

  - name: actividades
    label: Actividades y horarios
    type: file
    path: data/actividades.json
    format: json
    fields:
      - name: items
        label: Lista de actividades
        type: object
        list: true
        fields:
          - name: titulo
            label: Actividad
            type: string
          - name: dia
            label: Día
            type: string
          - name: hora
            label: Hora
            type: string
          - name: lugar
            label: Lugar
            type: string

  - name: videos
    label: Videos de YouTube
    type: file
    path: data/videos.json
    format: json
    fields:
      - name: items
        label: Lista de videos
        type: object
        list: true
        fields:
          - name: titulo
            label: Título del video
            type: string
          - name: enlace
            label: Enlace de YouTube
            type: string
