<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iglesia Bautista El Faro</title>
  <meta name="description" content="Sitio oficial de la Iglesia Bautista El Faro, Santo Domingo Norte. Horarios de cultos, actividades y mensajes.">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="encabezado"></div>

  <main>
    <section id="inicio" class="hero">
      <div class="hero-contenido">
        <svg class="hero-faro" aria-hidden="true"><use href="#faro"/></svg>
        <h1>Iglesia Bautista El Faro</h1>
        <p class="hero-lema">Brillando la luz de Cristo</p>

        <blockquote class="versiculo" id="versiculo">
          <p class="versiculo-texto" id="versiculoTexto" aria-hidden="true"></p>
          <p class="versiculo-cita" id="versiculoCita" aria-hidden="true"></p>
        </blockquote>

        <a href="actividades.html" class="btn">Ver horarios y actividades</a>
      </div>
    </section>

    <section id="noticias" class="section section-gris">
      <h2><svg class="ico" aria-hidden="true"><use href="#i-campana"/></svg>Noticias y avisos</h2>
      <div class="grid" id="listaNoticias">
        <p>Cargando...</p>
      </div>
    </section>

    <section id="ubicacion" class="section">
      <h2><svg class="ico" aria-hidden="true"><use href="#i-ubicacion"/></svg>Dónde estamos</h2>
      <p class="direccion">Calle Calixto García 17, Urb. Máximo Gómez, Santo Domingo Norte, R.D.</p>
      <div class="mapa">
        <iframe
          title="Mapa de la Iglesia Bautista El Faro"
          src="https://www.google.com/maps?q=Calle+Calixto+Garcia+17,+Urbanizacion+Maximo+Gomez,+Santo+Domingo+Norte&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
